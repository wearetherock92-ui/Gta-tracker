<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121212" />
  <title>GTA V Story Mission Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      background: #121212;
      color: #f1f1f1;
    }
    h1 { font-size: 24px; margin: 0 0 6px; color: #ffffff; }
    .subtitle { font-size: 13px; color: #999; margin: 0 0 18px; }
    .stats { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
    .bar-wrap { background: #2a2a2a; border-radius: 10px; overflow: hidden; height: 20px; margin-bottom: 18px; }
    .bar { background: linear-gradient(90deg, #27ae60, #2ecc71); height: 100%; width: 0%; transition: width 0.25s ease; }
    .controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    input[type="text"], select {
      background: #1e1e1e;
      border: 1px solid #333;
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      flex: 1;
      min-width: 140px;
    }
    button.reset-btn {
      background: #2c1618;
      border: 1px solid #5c2327;
      color: #ff6b6b;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .mission {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1c1c1c;
      border: 1px solid #282828;
      padding: 12px 14px;
      margin-bottom: 8px;
      border-radius: 8px;
      gap: 10px;
    }
    .mission label {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      flex: 1;
      font-size: 15px;
    }
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #2ecc71;
      cursor: pointer;
      flex-shrink: 0;
    }
    .tag {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      background: #2b2b2b;
      color: #ccc;
      white-space: nowrap;
    }
    .done { text-decoration: line-through; opacity: 0.55; }
    .ad-box {
      margin-top: 28px;
      padding: 18px;
      border: 1px dashed #444;
      border-radius: 10px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }
    footer { margin-top: 24px; text-align: center; font-size: 12px; color: #666; }
    footer a { color: #2ecc71; text-decoration: none; }
  </style>
</head>
<body>
  <h1>GTA V Mission Tracker</h1>
  <p class="subtitle">Track your 100% story mode progression</p>

  <div class="stats">
    <span id="status">0 / 69 Missions Completed</span>
    <span id="percent">0%</span>
  </div>
  <div class="bar-wrap"><div class="bar" id="bar"></div></div>

  <div class="controls">
    <input type="text" id="search" placeholder="Search mission..." />
    <select id="filter">
      <option value="all">All Missions</option>
      <option value="todo">Remaining</option>
      <option value="done">Completed</option>
    </select>
    <button class="reset-btn" id="resetBtn">Reset</button>
  </div>

  <div id="list"></div>

  <div class="ad-box">
    Advertisement / Sponsored Slot
  </div>

  <footer>
    Unofficial fan-made checklist. Not affiliated with Rockstar Games.<br />
